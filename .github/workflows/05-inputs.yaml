name: Inputs demo
on: 
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default : 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'test scenario tags'
        required: false
        type: boolean

 

jobs:
  trigger:
    runs-on: ubuntu-latest # github hosted runners
    steps:
      - name: print inputs
        run: |
         echo "Log level: ${{ inputs.logLevel }}"
         echo "Tags level: ${{ inputs.tags }}"


